name: Update skills & deploy

# Refreshes the site about every 2 hours, on every code push to main, and on demand
# (Actions tab → Run workflow).
#
# GitHub's scheduler is best-effort: on small repos it often starts scheduled runs hours late
# or drops them. So the schedule fires every 30 minutes and a run exits in a few seconds
# unless the data is at least 100 minutes old. Many cheap attempts, one real run per ~2 hours.
#
# Long-term design:
# - Generated data is NOT committed to main. It lives on a separate "data" branch that is
#   overwritten with a single commit each run, so the repo never grows over time.
# - A repo's file listing is cached by its last-push time, so an unchanged repo costs no API
#   calls. A normal run uses about 100-350 of the 1,000 calls GitHub allows per hour.
# - If collecting fails (GitHub outage, rate limit, sanity check), the job stops before
#   deploying. The live site keeps showing the last good data and the next run retries.
# - Each run re-enables this workflow via the API, so GitHub's "disable scheduled workflows
#   after 60 days of inactivity" rule never kicks in.

on:
  schedule:
    - cron: '7,37 * * * *'   # try every 30 minutes; most attempts skip (see above)
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:
    inputs:
      skip_if_fresh:
        description: 'Skip when the data is under 100 minutes old (what scheduled runs do)'
        type: boolean
        default: false

permissions:
  contents: write   # push the "data" branch
  pages: write      # deploy GitHub Pages
  id-token: write   # required by deploy-pages
  actions: write    # keep-alive (re-enable this workflow)

concurrency:
  group: skills-pipeline
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      skip: ${{ steps.fresh.outputs.skip }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Restore previous data (from the "data" branch)
        run: |
          if git fetch --depth=1 origin data 2>/dev/null; then
            git checkout FETCH_HEAD -- site/data cache
            echo "Restored previous data and cache."
          else
            echo "No data branch yet — first run will do a full scan."
          fi

      - name: Skip if the data is still fresh
        id: fresh
        env:
          GUARD: ${{ github.event_name == 'schedule' || inputs.skip_if_fresh == true }}
        run: |
          skip=false
          if [ "$GUARD" = "true" ] && [ -f site/data/skills.json ]; then
            age=$(node -e 'const d=JSON.parse(require("fs").readFileSync("site/data/skills.json","utf8"));console.log(Math.round((Date.now()-Date.parse(d.generatedAt))/60000))')
            echo "Data is $age minutes old."
            if [ "$age" -lt 100 ]; then skip=true; echo "Fresh enough, skipping this run."; fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

      - name: Collect skills from GitHub
        if: steps.fresh.outputs.skip != 'true'
        env:
          # Optional: save a personal access token as the SKILLS_GH_TOKEN secret for a higher API limit.
          GITHUB_TOKEN: ${{ secrets.SKILLS_GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: node scripts/collect.mjs

      - name: Save data to the "data" branch (single commit, no history growth)
        if: steps.fresh.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          mkdir -p "$tmp/site/data" "$tmp/cache"
          cp site/data/*.json "$tmp/site/data/"
          cp cache/state.json "$tmp/cache/"
          printf '# Generated data\n\nWritten automatically by the "Update skills & deploy" workflow. Do not edit by hand.\n' > "$tmp/README.md"
          cd "$tmp"
          git init -q -b data
          git config user.name "skillatlas-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "data: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push -fq "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data

      - name: Keep the schedule alive
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/update.yml/enable"

      - uses: actions/configure-pages@v6
        if: steps.fresh.outputs.skip != 'true'

      - uses: actions/upload-pages-artifact@v5
        if: steps.fresh.outputs.skip != 'true'
        with:
          path: site

  deploy:
    needs: update
    if: needs.update.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
