name: Weekly skills newsletter

# Sends the Monday "new skills" digest to all SkillAtlas subscribers.
# Timer: cron-job.org (primary) + this schedule (backup).
# Secrets needed: SMTP_USER, SMTP_APP_PASSWORD, NEWSLETTER_ENDPOINT, SITE_URL.

on:
  schedule:
    - cron: "30 9 * * 1"   # every Monday 09:30 UTC = 15:00 IST (backup)
  workflow_dispatch:        # manual "Run workflow" button for testing

permissions:
  contents: read

concurrency:
  group: newsletter-skillatlas

jobs:
  newsletter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Send weekly skills digest
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          NEWSLETTER_ENDPOINT: ${{ secrets.NEWSLETTER_ENDPOINT }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: python scripts/newsletter.py
